{% extends 'base.html' %}

{% block content %}
<h2>Excluir Veículo</h2>
<p>Tem certeza que deseja excluir <strong>{{ object.marca }} {{ object.modelo }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirmar Exclusão</button>
    <a class="btn btn-secondary" href="{% url 'veiculos_lista' %}">Cancelar</a>
</form>
{% endblock %}
