{% extends 'base.html' %}

{% block title %}Excluir Cliente{% endblock %}

{% block content %}
<h1>Excluir Cliente</h1>
<p>Tem certeza que deseja excluir <strong>{{ object.nome }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirmar Exclusão</button>
    <a class="btn btn-secondary" href="{% url 'clientes_lista' %}">Cancelar</a>
</form>
{% endblock %}
