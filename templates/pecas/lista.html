{% extends 'base.html' %}

{% block content %}
<h2>Peças</h2>
<a class="btn" href="{% url 'pecas_nova' %}">Nova Peça</a>
<br><br>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Marca</th>
            <th>Preço de Custo</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for peca in pecas %}
        <tr>
            <td>{{ peca.id }}</td>
            <td>{{ peca.nome }}</td>
            <td>{{ peca.marca|default:'-' }}</td>
            <td>R$ {{ peca.preco_custo }}</td>
            <td>
                <a class="btn btn-secondary" href="{% url 'pecas_editar' peca.id %}">Editar</a>
                <a class="btn btn-danger" href="{% url 'pecas_excluir' peca.id %}">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">Nenhuma peça cadastrada.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
